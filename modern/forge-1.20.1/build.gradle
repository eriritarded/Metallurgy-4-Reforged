buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }; maven { url = 'https://maven.minecraftforge.net' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
apply plugin: 'org.spongepowered.mixin'
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server { workingDirectory project.file('run'); args '--nogui'; mods { metallurgy { source sourceSets.main } } }
        gameTestServer { workingDirectory project.file('run'); property 'forge.enabledGameTestNamespaces', 'metallurgy'; mods { metallurgy { source sourceSets.main } } }
    }
}
repositories { mavenCentral(); maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }; maven { url = 'https://dvs1.progwml6.com/files/maven'; content { includeGroup 'slimeknights.tconstruct'; includeGroup 'slimeknights.mantle' } } }
repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'; annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
tasks.named('jar').configure { finalizedBy 'reobfJar' }

version = '1.4.1-port.9'
group = 'it.hurts.metallurgy_reforged'
base { archivesName = 'Metallurgy-Reforged-MC-1.20.1-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')
mixin { add sourceSets.main, 'metallurgy.refmap.json'; config 'metallurgy.mixins.json' }
jar { manifest { attributes('MixinConfigs':'metallurgy.mixins.json') } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { from('../LICENSE'); from('../NOTICE.md') }

// Explicit test-only source set; never part of an ordinary build.
if(project.hasProperty('verification')) {
    sourceSets.main.java.srcDir('../verification/forge-1.20.1/java')
    sourceSets.main.resources.srcDir('../verification/forge-1.20.1/resources')
}

apply from: '../tools/no-game-launch.gradle'

// Optional JEI API only; no dependency implementation is packaged.
dependencies { compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.71.0.224") }

// Native optional TConstruct3 modules; dependency implementations are not bundled.
dependencies {
    compileOnly fg.deobf('slimeknights.tconstruct:TConstruct:1.20.1-3.12.1.237')
    compileOnly fg.deobf('slimeknights.mantle:Mantle:1.20.1-1.11.115')
    compileOnly fg.deobf('maven.modrinth:spartan-weaponry:4U6gwadt')
}
